<!DOCTYPE html>

<head>

<title>Baton tabs</title>
<script type="module" src="js/entry-tabs.js"></script>
</head>
<body>
<div id="tab-strip" class="tab-strip" data-tauri-drag-region>
  <div class="tab-list" role="tablist" data-tauri-drag-region>

    </button>
  </div>
