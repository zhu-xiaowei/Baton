<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AgentPeek</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔭</text></svg>">
<!-- Critical CSS inline — prevents FOUC before bundled CSS loads (mobile webview cold start) -->
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}
  html,body{height:100%;overflow:clip}
  body{display:flex;flex-direction:column;position:fixed;width:100%;top:0;left:0;bottom:0}
  .top-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 12px;padding-top:max(env(safe-area-inset-top),6px);background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0}
  /* iOS WKWebView returns env(safe-area-inset-top)=0 for the first ~1s after launch.
     Floor it at 59px (Dynamic Island / notch device standard) to prevent the top-bar
     from briefly touching the top of the screen. -webkit-touch-callout is iOS-only,
     so Android skips this. Once env() resolves, the larger value naturally takes over. */
  @supports (-webkit-touch-callout:none){.top-bar{padding-top:max(env(safe-area-inset-top),59px)}}
  /* iOS WKWebView's frame settles ~50ms after first paint (status bar area gets cropped).
     Hide body briefly on iOS so users see the dark background instead of content jumping down.
     Android renders correctly on first frame, so it skips this. */
  @supports (-webkit-touch-callout:none){body{opacity:0}body.ready{opacity:1;transition:opacity .1s}}
  .top-left{font-size:13px;display:flex;align-items:center;gap:4px}
  .top-title{font-weight:600;color:#e6edf3}
  a.top-gear,a.top-gear:link,a.top-gear:visited{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:#6e7681;text-decoration:none}
  .breadcrumb{display:none;flex-shrink:0}
  #content{flex:1;overflow-y:auto}
</style>
<!-- All CSS + JS bundled via Vite from js/entry-index.js -->
<script type="module" src="js/entry-index.js"></script>
<script>
  // iOS only: reveal body after WKWebView frame settles (~50ms). No-op on Android.
  // Belt-and-suspenders: ensure body becomes visible even if some script error fires before DCL.
  if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
    var revealReady = function () { document.body && document.body.classList.add('ready'); };
    setTimeout(revealReady, 150);
    addEventListener('DOMContentLoaded', function () { setTimeout(revealReady, 50); });
  }
</script>
</head>
<body>

<!-- Auth guard: redirect to landing if no key -->
<script>
(function () {
  try { var k = localStorage.getItem('_ak'); if (!k || !atob(k)) throw 0; } catch(e) {
    location.replace('landing.html');
  }
})();
</script>

<!-- Top bar -->
<div class="top-bar" onclick="document.getElementById('content').scrollTo({top:0,behavior:'smooth'})">
  <div class="top-left" onclick="event.stopPropagation();loadDevices();" style="cursor:pointer">🔭 <span class="top-title">AgentPeek</span></div>
  <div id="top-right" onclick="event.stopPropagation()"><a href="setup.html" class="top-gear" title="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a></div>
</div>

<!-- Breadcrumb -->
<div id="breadcrumb" class="breadcrumb"></div>

<!-- Content area -->
<div id="content"></div>

<!-- Input bar -->
<div id="input-bar" style="display:none">
  <div id="img-preview-row" style="display:none"></div>
  <div class="input-row">
    <input type="file" id="img-picker" accept="image/*" multiple style="display:none" onchange="onImagePicked(this)" />
    <button class="img-btn" onclick="document.getElementById('img-picker').click()" title="Add image">+</button>
    <textarea id="msg-input" rows="1" placeholder="Send a message..." onpaste="onInputPaste(event)"></textarea>
    <button id="send-btn" onclick="onSendBtnClick()"><svg viewBox="0 0 24 24" width="16" height="16"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg></button>
  </div>
</div>

<!-- Stats (removed, replaced by ws-banner) -->

<!-- Scroll-to-bottom button -->
<button id="scroll-bottom-btn" class="scroll-bottom-btn" style="display:none" onclick="scrollToBottom()">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
</button>

<!-- New Project modal -->
<div id="newProjectModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeNewProjectModal()">
  <div class="modal-box">
    <div class="modal-title">New Project</div>
    <div class="modal-desc">Enter directory name (relative to home) or full path</div>
    <input id="newProjectInput" class="modal-input" type="text" placeholder="e.g. asset/demo" autocomplete="off" onkeydown="if(event.key==='Enter')submitNewProject();if(event.key==='Escape')closeNewProjectModal();" />
    <div class="modal-error" id="newProjectError"></div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeNewProjectModal()">Cancel</button>
      <button class="modal-btn confirm" onclick="submitNewProject()">Create</button>
    </div>
  </div>
</div>

<!-- Image overlay -->
<div id="imgOverlay" class="img-overlay" style="display:none" onclick="this.style.display='none'">
  <img id="imgOverlayImg" />
</div>

</body>
</html>
