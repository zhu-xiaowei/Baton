<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Baton remote preview check</title>
  <style>
    html { background: #0d1117; color: #e6edf3; font: 16px system-ui; }
    body { margin: 0; padding: max(20px, env(safe-area-inset-top)) 20px 20px; }
    h1 { font-size: 23px; }
    #status { line-height: 1.5; overflow-wrap: anywhere; }
    button { padding: 10px 14px; font: inherit; }
    #configForm { display: grid; gap: 12px; max-width: 420px; }
    #configForm[hidden] { display: none; }
    #configForm label { display: grid; gap: 4px; }
    #configForm input { padding: 9px; font: inherit; }
  </style>
</head>
<body>
  <h1>Remote preview check</h1>
  <p id="status" role="status">Starting...</p>
  <p id="traffic">Transferred: 0 bytes</p>
  <form id="configForm" hidden>
    <label>Test API key <input id="testKey" type="password" aria-label="Test API key" autocomplete="off" required></label>
    <label>WebSocket URL <input id="testWsUrl" type="url" aria-label="WebSocket URL" required></label>
    <label>Device <input id="testDevice" type="text" aria-label="Device" required></label>
    <button type="submit" aria-label="Start isolated preview">Start isolated preview</button>
  </form>
  <button id="retry" type="button">Open browser again</button>
  <script type="module" src="js/preview-live-check.js"></script>
</body>
</html>
