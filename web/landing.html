<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AgentPeek</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔭</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d1117; color: #e6edf3; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 100%; max-width: 400px; padding: 40px 32px; text-align: center;
  }
  .logo { font-size: 48px; margin-bottom: 8px; }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
  .tagline { color: #8b949e; font-size: 14px; margin-bottom: 32px; line-height: 1.5; }
  .input-group { margin-bottom: 16px; text-align: left; }
  .input-group label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 6px; }
  .input-group input {
    width: 100%; padding: 10px 14px; background: #161b22; border: 1px solid #30363d;
    border-radius: 8px; color: #e6edf3; font-size: 14px; outline: none;
  }
  .input-group input:focus { border-color: #58a6ff; }
  .input-group input::placeholder { color: #484f58; }
  .btn {
    width: 100%; padding: 12px; background: #238636; border: none; border-radius: 8px;
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px;
  }
  .btn:hover { background: #2ea043; }
  .btn:active { background: #196c2e; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { color: #f85149; font-size: 12px; margin-top: 8px; display: none; }
  .links { margin-top: 24px; font-size: 12px; color: #6e7681; }
  .links a { color: #58a6ff; text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .server-hint { font-size: 11px; color: #6e7681; margin-top: 4px; word-break: break-all; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">🔭</div>
  <h1>AgentPeek</h1>
  <p class="tagline">Monitor Claude Code sessions<br>from anywhere, in real-time.</p>

  <div class="input-group">
    <label>API Key</label>
    <input id="keyInput" type="password" placeholder="Paste your API key" autocomplete="off"
      onkeydown="if(event.key==='Enter')doConnect()" />
  </div>

  <button class="btn" id="connectBtn" onclick="doConnect()">Connect</button>
  <div class="error" id="error"></div>
  <div class="server-hint" id="serverHint"></div>

  <div class="links">
    <a href="setup.html" id="setupLink" style="display:none">Setup Bridge</a>
  </div>
</div>

<script>
// Derive server base URL from current page origin + path prefix
// e.g. https://xxx.execute-api.xxx.amazonaws.com/v1/landing.html -> /v1
var pathPrefix = location.pathname.replace(/\/[^/]*$/, ''); // strip filename
var SERVER = location.origin + pathPrefix;

// Storage helpers (btoa/atob obfuscation)
function saveKey(key) { localStorage.setItem('_ak', btoa(key)); }
function loadKey() { try { var v = localStorage.getItem('_ak'); return v ? atob(v) : ''; } catch { return ''; } }
function saveServer(url) { localStorage.setItem('_as', url); }
function loadServer() { return localStorage.getItem('_as') || ''; }

// Check URL ?key= param
var urlKey = new URLSearchParams(location.search).get('key');
if (urlKey) {
  saveKey(urlKey);
  saveServer(SERVER);
  // Clean URL and redirect
  location.replace('index.html');
} else {
  // Check localStorage
  var storedKey = loadKey();
  var storedServer = loadServer();
  if (storedKey && storedServer) {
    // Already have key — go to viewer
    location.replace('index.html');
  }
}

// Show server hint
document.getElementById('serverHint').textContent = SERVER;

// Pre-fill if key exists but user navigated back (e.g. logout)
var existing = loadKey();
if (existing) document.getElementById('keyInput').value = existing;

// Setup link: only show when we have a key
function updateSetupLink() {
  var link = document.getElementById('setupLink');
  var key = document.getElementById('keyInput').value.trim() || loadKey();
  if (key) {
    link.href = 'setup.html';
    link.style.display = 'inline';
  }
}
updateSetupLink();
document.getElementById('keyInput').addEventListener('input', updateSetupLink);

async function doConnect() {
  var key = document.getElementById('keyInput').value.trim();
  var errEl = document.getElementById('error');
  var btn = document.getElementById('connectBtn');

  if (!key) { errEl.textContent = 'Please enter an API key'; errEl.style.display = 'block'; return; }

  btn.disabled = true;
  btn.textContent = 'Connecting...';
  errEl.style.display = 'none';

  try {
    var res = await fetch(SERVER + '/api/health', { headers: { 'x-api-key': key } });
    if (!res.ok) throw new Error('Server returned ' + res.status);

    // Verify key works with a real API call
    var devRes = await fetch(SERVER + '/api/bridge/devices', { headers: { 'x-api-key': key } });
    if (!devRes.ok) throw new Error('Invalid API key');

    saveKey(key);
    saveServer(SERVER);
    location.replace('index.html');
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Connect';
  }
}
</script>

</body>
</html>
