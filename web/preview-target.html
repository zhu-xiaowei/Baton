<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baton remote preview target</title>
  <style>
    html { background: #0d1117; color: #e6edf3; font: 18px system-ui; }
    body { margin: 32px; }
    h1 { color: #3fb950; }
  </style>
</head>
<body>
  <h1>Remote preview target</h1>
  <p id="asset-status">Checking a large JavaScript file...</p>
  <script type="module">
    const result = document.getElementById('asset-status');
    try {
      const response = await fetch('/js/ws.js');
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const text = await response.text();
      if (new TextEncoder().encode(text).length <= 32 * 1024) throw new Error('File too small');
      result.textContent = 'Large JavaScript file loaded through preview';
    } catch (error) {
      result.textContent = `Preview failed: ${error.message}`;
    }
  </script>
</body>
</html>
