<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AgentPeek Setup</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔭</text></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
</style>
<script type="module" src="js/entry-setup.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d1117; color: #e6edf3; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px;
    padding-top: 24px;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  }
  .setup-bar { display: flex; align-items: center; padding: 6px 8px; padding-top: calc(6px + env(safe-area-inset-top, 0px)); background: #161b22; border-bottom: 1px solid #30363d; position: sticky; top: 0; z-index: 10; margin: -24px -16px 24px -16px; width: calc(100% + 32px); }
  .setup-bar .back { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; color: #6e7681; text-decoration: none; -webkit-tap-highlight-color: transparent; transition: all 0.15s; flex-shrink: 0; }
  .setup-bar .back:hover { color: #e6edf3; background: #21262d; }
  .setup-bar .title { flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: #e6edf3; }
  .setup-bar .spacer { width: 28px; flex-shrink: 0; }
  .section {
    width: 100%; max-width: 600px; background: #161b22; border: 1px solid #30363d;
    border-radius: 10px; padding: 20px; margin-bottom: 20px;
  }
  .section h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .section h2 .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%; background: #238636;
    font-size: 13px; font-weight: 700; flex-shrink: 0;
  }
  .code-block {
    background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
    padding: 14px 48px 14px 16px; font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px; line-height: 1.6; overflow-x: auto; white-space: pre-wrap;
    word-break: break-all; position: relative; color: #e6edf3;
  }
  .copy-btn {
    position: absolute; top: 8px; right: 8px; padding: 4px 10px;
    background: #21262d; border: 1px solid #30363d; border-radius: 6px;
    color: #8b949e; font-size: 11px; cursor: pointer;
  }
  .copy-btn:hover { background: #30363d; color: #e6edf3; }
  .copy-btn.copied { background: #238636; color: #fff; border-color: #238636; }
  .hint { color: #8b949e; font-size: 12px; margin-top: 8px; line-height: 1.5; }
  .qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .qr-frame { background: #fff; padding: 12px; border-radius: 12px; display: inline-block; line-height: 0; }
  .qr-frame canvas { border-radius: 4px; display: block; }
  .url-block {
    width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
    padding: 10px 56px 10px 14px; position: relative;
    font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; color: #8b949e;
    line-height: 1.5; white-space: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .url-block::-webkit-scrollbar { height: 4px; }
  .url-block::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
</style>
</head>
<body>

<div class="setup-bar">
  <a href="index.html" class="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
  <span class="title">Setup</span>
  <span class="spacer"></span>
</div>

<!-- Step 1: Install Bridge -->
<div class="section">
  <h2><span class="num">1</span> Install Bridge</h2>
  <p class="hint" style="margin-bottom:10px">Run this command on any Mac or Linux machine with Node.js installed:</p>
  <div class="code-block" id="installCmd"><span id="installCmdText">Loading...</span><button class="copy-btn" onclick="copyCmd(this)">Copy</button></div>
</div>

<!-- Step 2: QR Code for mobile -->
<div class="section">
  <h2><span class="num">2</span> Open on Phone</h2>
  <p class="hint" style="margin-bottom:14px">Scan this QR code to open AgentPeek viewer on your phone:</p>
  <div class="qr-wrap">
    <div class="qr-frame"><canvas id="qrCanvas"></canvas></div>
    <div class="url-block"><span id="qrUrl"></span><button class="copy-btn" onclick="copyUrl(this)">Copy</button></div>
  </div>
</div>

<!-- Logout -->
<div style="text-align:center; margin-bottom:32px;">
  <button onclick="logout()"
    style="padding:8px 24px; background:transparent; border:1px solid #30363d; border-radius:8px; color:#f85149; font-size:13px; cursor:pointer;">Log out</button>
</div>

</body>
</html>
