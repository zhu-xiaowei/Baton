<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AgentPeek Setup</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔭</text></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  html{scrollbar-color:#3a4049 transparent}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#3a4049;border-radius:3px}
</style>
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/entry-setup.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { color-scheme: dark; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d1117; color: #e6edf3;
    display: flex; flex-direction: column;
  }
  .setup-bar { display: flex; align-items: center; padding: 6px 8px; padding-top: calc(6px + var(--sat, env(safe-area-inset-top, 0px))); background: #161b22; border-bottom: 1px solid #30363d; flex-shrink: 0; }
  .setup-content { flex: 1; overflow-y: auto; padding: 24px 16px; padding-bottom: calc(var(--sab, env(safe-area-inset-bottom, 0px)) + 24px); display: flex; flex-direction: column; align-items: center; background: #0d1117; }
  .setup-bar .back { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; color: #6e7681; text-decoration: none; -webkit-tap-highlight-color: transparent; transition: all 0.15s; flex-shrink: 0; }
  .setup-bar .back:hover { color: #e6edf3; background: #21262d; }
  .setup-bar .title { flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: #e6edf3; }
  .setup-bar .spacer { width: 28px; flex-shrink: 0; }
  .section {
    width: 100%; max-width: 600px; background: #161b22; border: 1px solid #30363d;
    border-radius: 10px; padding: 20px; margin-bottom: 20px;
  }
  .section h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .section h2 .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%; background: #238636;
    font-size: 13px; font-weight: 700; flex-shrink: 0;
  }
  .platform-switch { display: inline-flex; gap: 2px; padding: 2px; margin-bottom: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; }
  .platform-option { min-height: 28px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #8b949e; font-size: 12px; cursor: pointer; }
  .platform-option.active { background: #30363d; color: #e6edf3; }
  .code-block {
    width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
    padding: 14px 16px; font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px; line-height: 1.6; overflow-x: auto; white-space: pre-wrap;
    word-break: break-all; position: relative; color: #e6edf3;
  }
  .code-btn {
    position: absolute; top: 6px; right: 6px; padding: 3px 10px;
    background: rgba(33, 38, 45, 0.92); border: 1px solid #30363d; border-radius: 6px;
    color: #8b949e; font-size: 11px; cursor: pointer; backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .code-btn:hover { background: #30363d; color: #e6edf3; }
  .code-btn.copied { background: #238636; color: #fff; border-color: #238636; }
  .hint { color: #8b949e; font-size: 12px; margin-top: 8px; line-height: 1.5; }
  .qr-wrap { display: flex; flex-direction: column; align-items: center; }
  .qr-frame { background: #fff; padding: 12px; border-radius: 12px; display: inline-block; line-height: 0; }
  .qr-frame canvas { border-radius: 4px; display: block; }
</style>
</head>
<body>

<div class="setup-bar">
  <a href="index.html" class="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
  <span class="title">Setup</span>
  <span class="spacer"></span>
</div>

<div class="setup-content">
<!-- Step 1: Install Bridge -->
<div class="section">
  <h2><span class="num">1</span> Install Bridge</h2>
  <div class="platform-switch" role="group" aria-label="Bridge platform">
    <button class="platform-option" data-platform="unix" onclick="selectInstallPlatform('unix')">macOS / Linux</button>
    <button class="platform-option" data-platform="windows" onclick="selectInstallPlatform('windows')">Windows</button>
  </div>
  <p class="hint" id="installHint" style="margin:0 0 10px">Run this command with Node.js installed.</p>
  <div class="code-block" id="installCmd"><span id="installCmdText">Loading...</span><button class="code-btn" onclick="copyCmd(this)">Copy</button></div>
</div>

<!-- Step 2: Start URL — paste into another browser or the AgentPeek app -->
<div class="section">
  <h2><span class="num">2</span> Start URL</h2>
  <p class="hint" style="margin-bottom:10px">Paste this Start URL into a browser or the AgentPeek app to sign in.</p>
  <div class="code-block" id="qrUrlBlock"><span id="qrUrl"></span><button class="code-btn" onclick="copyUrl(this)">Copy</button></div>
</div>

<!-- Step 3: QR Code (scan version of the same Start URL) -->
<div class="section">
  <h2><span class="num">3</span> Scan QR Code</h2>
  <p class="hint" style="margin-bottom:14px">Scan with the AgentPeek app on your phone to sign in.</p>
  <div class="qr-wrap">
    <div class="qr-frame"><canvas id="qrCanvas"></canvas></div>
  </div>
</div>

<!-- Logout -->
<div style="text-align:center; margin-bottom:8px;">
  <button onclick="logout()"
    style="padding:8px 24px; background:transparent; border:1px solid #30363d; border-radius:8px; color:#f85149; font-size:13px; cursor:pointer;">Log out</button>
</div>

<!-- App version (iOS only — undefined elsewhere, hidden by default) -->
<div id="appVersion" style="text-align:center; margin-bottom:32px; color:#6e7681; font-size:11px; display:none;"></div>
</div>

</body>
</html>
