<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/theme-init.js"></script>
<link rel="stylesheet" href="css/themes/dark.css">
<link rel="stylesheet" href="css/themes/light.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<script src="/native-mobile.js"></script>
<script src="/page-zoom.js"></script>
<title>Baton Setup</title>
<link rel="icon" type="image/svg+xml" href="assets/baton-app-icon.svg" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="assets/baton-app-icon-light.svg" media="(prefers-color-scheme: dark)">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--canvas);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  html{scrollbar-color:var(--scrollbar) transparent}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}
</style>
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/entry-setup.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { color-scheme: inherit; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--canvas); color: var(--text-primary);
    display: flex; flex-direction: column;
  }
  .setup-bar { display: flex; align-items: center; min-height: 44px; padding: 6px 8px; padding-top: max(var(--sat, env(safe-area-inset-top, 0px)), 6px); background: var(--surface-elevated); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .setup-content { flex: 1; overflow-y: auto; padding: 24px 16px; padding-bottom: calc(var(--sab, env(safe-area-inset-bottom, 0px)) + 24px); display: flex; flex-direction: column; align-items: center; background: var(--canvas); }
  .setup-back-slot { width: 28px; height: 28px; flex: 0 0 28px; display: flex; }
  .setup-bar .title { flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .setup-bar .spacer { width: 28px; flex-shrink: 0; }
  .section {
    width: 100%; max-width: 610px; background: var(--surface-elevated); border: 1px solid var(--border); box-shadow: var(--shadow-card);
    border-radius: 10px; padding: 20px; margin-bottom: 20px;
  }
  .section h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .section h2 .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%; background: var(--success-solid);
    font-size: 13px; font-weight: 700; flex-shrink: 0; color: var(--on-step);
  }
  .platform-switch { display: inline-flex; flex-wrap: wrap; max-width: 100%; gap: 2px; padding: 2px; margin-bottom: 10px; background: var(--canvas); border: 1px solid var(--border); border-radius: 6px; }
  .platform-option { min-height: 28px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: var(--text-secondary); font-size: 12px; cursor: pointer; }
  .platform-option.active, .platform-option[aria-pressed="true"] { background: var(--border); color: var(--text-primary); }
  .code-block {
    width: 100%; background: var(--canvas); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px; line-height: 1.6; overflow-x: auto; white-space: pre-wrap;
    word-break: break-all; position: relative; color: var(--text-primary);
  }
  .code-btn {
    position: absolute; top: 6px; right: 6px; padding: 3px 10px;
    background: var(--code-button); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-secondary); font-size: 11px; cursor: pointer; backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .code-btn:hover { background: var(--border); color: var(--text-primary); }
  .code-btn.copied { background: var(--success-solid); color: var(--on-accent); border-color: var(--success-solid); }
  .hint { color: var(--text-secondary); font-size: 12px; margin-top: 8px; line-height: 1.5; }
  .qr-wrap { display: flex; flex-direction: column; align-items: center; }
  .qr-frame { max-width: 100%; background: var(--on-accent); padding: 12px; border-radius: 12px; display: inline-block; line-height: 0; visibility: hidden; }
  .qr-frame.ready { visibility: visible; }
  .qr-frame canvas { max-width: 100%; height: auto; border-radius: 4px; display: block; }
  .logout-btn { font-size: 13px; }
  .setting-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; }
  div.setting-row { cursor: default; }
  .setting-row strong { font-size: 15px; font-weight: 600; }
  #notificationStatus:empty { display: none; }
  .setting-row .platform-switch { margin: 0; }
  .switch { appearance: none; -webkit-appearance: none; flex: 0 0 auto; width: 44px; height: 26px; margin: 0; border-radius: 13px; background: var(--switch-track); position: relative; cursor: pointer; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--switch-knob); transition: transform .15s; }
  .switch:checked { background: var(--success-solid); }
  .switch:checked::after { transform: translateX(18px); }
  .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  html.native-mobile .setup-bar {
    min-height: calc(var(--sat, env(safe-area-inset-top, 0px)) + 44px);
    padding: var(--sat, env(safe-area-inset-top, 0px)) 0 0;
    border-bottom: 0;
    box-shadow: inset 0 -1px var(--border);
  }
  html.native-mobile .setup-back-slot { width: 44px; height: 44px; flex-basis: 44px; }
  html.native-mobile .setup-bar .title { font-size: 17px; }
  html.native-mobile .setup-bar .spacer { width: 44px; }
  html.native-mobile .setup-content { padding: 20px 14px; padding-bottom: calc(var(--sab, env(safe-area-inset-bottom, 0px)) + 24px); }
  html.native-mobile .section { padding: 18px 16px; margin-bottom: 16px; }
  html.native-mobile .section h2 { font-size: 17px; }
  html.native-mobile .section h2 .num { width: 26px; height: 26px; font-size: 14px; }
  html.native-mobile .platform-option { min-height: 34px; font-size: 14px; }
  html.native-mobile .code-block { padding: 14px 16px; font-size: 13px; line-height: 1.65; }
  html.native-mobile .code-btn { min-height: 30px; font-size: 12px; }
  html.native-mobile .hint { font-size: 14px; line-height: 1.55; }
  html.native-mobile .logout-btn { min-height: 40px; font-size: 15px; }
  html.native-mobile #appVersion { font-size: 12px !important; }
</style>
</head>
<body>

<div class="setup-bar">
  <span id="setupBackButton" class="setup-back-slot"></span>
  <span class="title">Setup</span>
  <span class="spacer"></span>
</div>

<div class="setup-content">
<!-- Step 1: Install Bridge -->
<div class="section">
  <h2><span class="num">1</span> Install Bridge</h2>
  <div class="platform-switch" role="group" aria-label="Bridge platform">
    <button class="platform-option" data-platform="unix" onclick="selectInstallPlatform('unix')">macOS / Linux</button>
    <button class="platform-option" data-platform="windows" onclick="selectInstallPlatform('windows')">Windows</button>
  </div>
  <p class="hint" id="installHint" style="margin:0 0 10px">Run this command with Node.js installed.</p>
  <div class="code-block" id="installCmd"><span id="installCmdText">Loading...</span><button class="code-btn" onclick="copyCmd(this)">Copy</button></div>
  <p class="hint token-expiry"></p>
</div>

<!-- Step 2: Start URL — paste into another browser or the Baton app -->
<div class="section">
  <h2><span class="num">2</span> Start URL</h2>
  <p class="hint" style="margin-bottom:10px">Paste this Start URL into a browser or the Baton app to sign in.</p>
  <div class="code-block" id="qrUrlBlock"><span id="qrUrl">Loading...</span><button class="code-btn" onclick="copyUrl(this)">Copy</button></div>
  <p class="hint token-expiry"></p>
</div>

<!-- Step 3: QR Code (scan version of the same Start URL) -->
<div class="section">
  <h2><span class="num">3</span> Scan QR Code</h2>
  <p class="hint" style="margin-bottom:14px">Scan with the Baton app on your phone to sign in.</p>
  <div class="qr-wrap">
    <div class="qr-frame"><canvas id="qrCanvas" width="200" height="200"></canvas></div>
  </div>
</div>

<div id="notificationSettings" class="section" hidden>
  <label class="setting-row">
    <strong>Push notifications</strong>
    <input id="notificationsEnabled" class="switch" type="checkbox" role="switch">
  </label>
  <p class="hint" id="notificationStatus" role="status"></p>
</div>

<div id="themeSettings" class="section">
  <div class="setting-row">
    <strong>Appearance</strong>
    <div class="platform-switch" role="group" aria-label="Appearance">
      <button class="platform-option" data-theme-option="system">System</button>
      <button class="platform-option" data-theme-option="light">Light</button>
      <button class="platform-option" data-theme-option="dark">Dark</button>
    </div>
  </div>
</div>
<section id="textSizeSettings" class="section text-size-setting" aria-labelledby="textSizeTitle" hidden>
  <div class="text-size-heading">
    <h2 id="textSizeTitle">Font size</h2>
    <span class="text-size-value" aria-hidden="true">100%</span>
  </div>
  <input id="textSizeSlider" class="text-size-slider" type="range" min="0" max="5" step="1" value="1" aria-labelledby="textSizeTitle">
  <div class="text-size-stops" aria-hidden="true"></div>
</section>

<!-- Logout -->
<div style="text-align:center; margin-bottom:8px;">
  <button onclick="logout()"
    class="logout-btn"
    style="padding:8px 24px; background:transparent; border:1px solid var(--border); border-radius:8px; color:var(--danger); cursor:pointer;">Log out</button>
</div>

<!-- App version (iOS only — undefined elsewhere, hidden by default) -->
<div id="appVersion" style="text-align:center; margin-bottom:32px; color:var(--text-muted); font-size:11px; display:none;"></div>
</div>

</body>
</html>
