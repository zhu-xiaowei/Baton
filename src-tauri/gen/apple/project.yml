name: baton
options:
  bundleIdPrefix: com.batonai.app
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Baton
      PRODUCT_BUNDLE_IDENTIFIER: com.batonai.app
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  baton_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: AppIcon.icon
      - path: Externals
      - path: baton_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: baton_iOS/Info.plist
      properties:
        BatonKeychainGroup: $(AppIdentifierPrefix)com.batonai.shared
        BatonPushEnvironment: $(BATON_APNS_ENVIRONMENT)
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        # Dark app: force light (white) status bar text from the first launch frame, else iOS
        # defaults to dark text (invisible on our dark bg) and flashes white->dark->white.
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "58"
        NSMicrophoneUsageDescription: Baton uses the microphone for voice input.
        NSSpeechRecognitionUsageDescription: Baton uses speech recognition to convert your voice to text.
        NSPhotoLibraryAddUsageDescription: Baton can save downloaded images or videos when you choose Save in the share sheet.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: baton_iOS/baton_iOS.entitlements
      properties:
        aps-environment: $(BATON_APNS_ENVIRONMENT)
        keychain-access-groups: [$(AppIdentifierPrefix)com.batonai.shared]
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      configs:
        debug:
          BATON_APNS_ENVIRONMENT: development
        release:
          BATON_APNS_ENVIRONMENT: production
      base:
        ENABLE_BITCODE: false
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: false
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: default
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - target: NotificationService
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  # Resolves each ID-only push against the user's own server before it is shown.
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
    info:
      path: NotificationService/Info.plist
      properties:
        BatonKeychainGroup: $(AppIdentifierPrefix)com.batonai.shared
        CFBundleDisplayName: Baton
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "58"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.batonai.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batonai.app.NotificationService
        DEVELOPMENT_TEAM: BUA6W9H7T3
