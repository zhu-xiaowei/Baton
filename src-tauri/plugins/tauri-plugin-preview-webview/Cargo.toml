[package]
name = "tauri-plugin-preview-webview"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-preview-webview"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
serde = { version = "1", features = ["derive"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSEvent", "NSResponder", "NSWindow", "NSColor"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSURL", "NSURLRequest", "NSError", "NSValue", "NSKeyValueCoding", "NSKeyValueObserving", "NSProcessInfo", "NSThread"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKNavigation", "WKNavigationDelegate", "WKUIDelegate", "WKNavigationAction", "WKWindowFeatures", "WKFrameInfo"] }
