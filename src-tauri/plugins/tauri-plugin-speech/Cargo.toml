[package]
name = "tauri-plugin-speech"
version = "0.1.0"
description = "On-device speech-to-text via SFSpeechRecognizer (iOS)"
edition = "2021"
links = "tauri-plugin-speech"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
thiserror = "1"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", features = ["wry"] }
