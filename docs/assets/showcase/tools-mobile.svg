<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="32">
  <title>Developer tools captions</title>
  <style>
    text { fill: #1f2328; font-size: 16px; }
    @media (prefers-color-scheme: dark) { text { fill: #e6edf3; } }
    @media (max-width: 330px) { text { font-size: 14px; } }
    @media (max-width: 288px) { text { font-size: 12px; } }
  </style>
  <g font-family="'Mona Sans VF', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Backtick Fix', 'Noto Sans', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'" font-weight="400" text-anchor="middle">
    <text x="25%" y="21">Project files</text>
    <text x="75%" y="21">Git changes</text>
  </g>
</svg>
