<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AgentPeek Test</title>
<link rel="stylesheet" href="css/style.css">
<!-- highlight.js CSS must come BEFORE diff2html CSS (per diff2html docs) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css">
</head>
<body>

<!-- Config -->
<div class="config" id="configPanel">
  <div id="configCollapsed" style="display:none; cursor:pointer;" onclick="toggleConfig()">
    <span class="status ok" style="display:inline">Connected</span>
    <span style="color:#6e7681; font-size:12px; margin-left:8px;" id="configHostHint"></span>
    <span style="float:right; color:#58a6ff; font-size:12px;">Edit &#9662;</span>
  </div>
  <div id="configExpanded">
    <input id="serverUrl" placeholder="Server URL (e.g. https://xxx.execute-api.xxx.amazonaws.com/v1)" />
    <input id="apiKey" placeholder="API Key" />
    <div class="row">
      <button onclick="connect()">Connect</button>
    </div>
    <div id="configStatus" class="status"></div>
  </div>
</div>

<!-- Breadcrumb -->
<div id="breadcrumb" class="breadcrumb"></div>

<!-- Content area -->
<div id="content"></div>

<!-- Stats -->
<div id="stats" class="stats" style="display:none"></div>

<!-- Image overlay -->
<div id="imgOverlay" class="img-overlay" style="display:none" onclick="this.style.display='none'">
  <img id="imgOverlayImg" />
</div>

<!-- CDN libs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html-ui.min.js"></script>

<!-- App modules (order matters) -->
<script src="js/components/markdown.js"></script>
<script src="js/components/tool.js"></script>
<script src="js/components/message.js"></script>
<script src="js/render.js"></script>
<script src="js/api.js"></script>
<script src="js/ws.js"></script>
<script src="js/app.js"></script>
</body>
</html>
