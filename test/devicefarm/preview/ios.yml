version: 0.1
ios_test_host: macos_tahoe
phases:
  install:
    commands:
      - devicefarm-cli use node 24
      - devicefarm-cli use appium 3
      - devicefarm-cli use python 3.12
      - python -m pip install --quiet Appium-Python-Client==5.2.4
  pre_test:
    commands:
      - |-
        driver_version=$(appium driver list --installed --json | jq -r '.xcuitest.version' | cut -d '.' -f 1)
        derived_variable="DEVICEFARM_APPIUM_WDA_DERIVED_DATA_PATH_V${driver_version}"
        if [ -n "${!derived_variable:-}" ]; then
          export DEVICEFARM_APPIUM_WDA_DERIVED_DATA_PATH="${!derived_variable}"
        fi
      - |-
        appium --log-no-colors --relaxed-security \
          > "$DEVICEFARM_LOG_DIR/appium.log" 2>&1 &
      - |-
        for attempt in $(seq 1 45); do
          curl --silent --fail http://127.0.0.1:4723/status && break
          sleep 1
        done
  test:
    commands:
      - cd "$DEVICEFARM_TEST_PACKAGE_PATH"
      - python tests/test_preview.py
artifacts:
  - "$DEVICEFARM_SCREENSHOT_PATH"
  - "$DEVICEFARM_LOG_DIR"
