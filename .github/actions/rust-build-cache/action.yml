name: Rust build cache
description: Configure an isolated PR or release build and restore its Rust dependencies.
inputs:
  platform:
    description: Cache namespace for the target platform.
    required: true
  targets:
    description: Rust targets to install.
    required: true
  flavor:
    description: pr or release; release preserves the production Cargo profile.
    default: release
  sdk:
    description: SDK version used by this build.
    required: true
runs:
  using: composite
  steps:
    - name: Select Rust build configuration
      id: config
      shell: bash
      env:
        BUILD_FLAVOR: ${{ inputs.flavor }}
      run: |
        rust_version="$(node -e 'const fs = require("node:fs"); const text = fs.readFileSync("rust-toolchain.toml", "utf8"); const match = text.match(/^\s*channel\s*=\s*"(\d+\.\d+\.\d+)"/m); if (!match) throw new Error("Pin a Rust version in rust-toolchain.toml"); process.stdout.write(match[1]);')"
        case "$BUILD_FLAVOR" in
          pr)
            target_dir=target-ci
            lto=false
            codegen_units=16
            opt_level=1
            ;;
          release)
            target_dir=target
            lto=true
            codegen_units=1
            opt_level=s
            ;;
          *) echo "Unsupported build flavor: $BUILD_FLAVOR" >&2; exit 1 ;;
        esac
        {
          echo "RUSTUP_TOOLCHAIN=$rust_version"
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/src-tauri/$target_dir"
          echo "CARGO_PROFILE_RELEASE_LTO=$lto"
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=$codegen_units"
          echo "CARGO_PROFILE_RELEASE_OPT_LEVEL=$opt_level"
          echo "CARGO_INCREMENTAL=0"
          # Keep the restore key identical before each profile's offline probe.
          echo "CARGO_NET_OFFLINE=false"
        } >> "$GITHUB_ENV"
        echo "target-dir=$target_dir" >> "$GITHUB_OUTPUT"
        node -e 'const fs = require("node:fs"), path = require("node:path"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "cache-command=" + path.resolve(".github/scripts/rust-cache-command.cjs").split(path.sep).join("/") + "\n");'
    - name: Install pinned Rust toolchain
      shell: bash
      env:
        RUST_TARGETS: ${{ inputs.targets }}
      run: |
        rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
        # Tauri's mobile subprocesses filter RUSTUP_TOOLCHAIN from their environment.
        # Set the hosted runner's default too, so Gradle/Xcode use the same compiler.
        rustup default "$RUSTUP_TOOLCHAIN"
        for target in $RUST_TARGETS; do
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" "$target"
        done
    - name: Fingerprint the selected compiler and native SDK
      id: fingerprint
      shell: bash
      env:
        BUILD_PLATFORM: ${{ inputs.platform }}
        BUILD_SDK: ${{ inputs.sdk }}
      run: |
        fingerprint="$RUNNER_TEMP/baton-rust-toolchain.txt"
        {
          rustc -vV
          cargo -vV
          printf '%s\n' "$BUILD_PLATFORM" "$BUILD_SDK"
          case "$BUILD_PLATFORM" in
            android)
              cat "$NDK_HOME/source.properties"
              "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
              ;;
            ios|macos)
              xcodebuild -version
              sdk=macosx
              [[ "$BUILD_PLATFORM" != ios ]] || sdk=iphoneos
              xcrun --sdk "$sdk" --show-sdk-build-version
              xcrun clang --version
              ;;
            windows)
              powershell.exe -NoProfile -Command '$ErrorActionPreference = "Stop"; $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"; $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath; if (!$vs) { throw "MSVC installation missing" }; $tools = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim(); "MSVC=$tools"; (Get-Item "$vs\VC\Tools\MSVC\$tools\bin\Hostx64\x64\cl.exe").VersionInfo.FileVersion; Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Lib" -Directory | Where-Object Name -Match "^\d+\.\d+\.\d+\.\d+$" | Sort-Object { [version]$_.Name } | Select-Object -Last 1 -ExpandProperty Name'
              ;;
            *) echo "Unknown native platform: $BUILD_PLATFORM" >&2; exit 1 ;;
          esac
          node -e 'for (const key of Object.keys(process.env).sort()) if (/^(CARGO|RUST|CC|CFLAGS|CXX|CMAKE)/.test(key)) console.log(`${key}=${process.env[key]}`);'
        } > "$fingerprint"
        hash="$(node -e 'const fs = require("node:fs"), crypto = require("node:crypto"); process.stdout.write(crypto.createHash("sha256").update(fs.readFileSync(process.argv[1], "utf8").replace(/\r\n/g, "\n")).digest("hex"));' "$fingerprint")"
        echo "key=$hash" >> "$GITHUB_OUTPUT"
    - uses: Swatinem/rust-cache@v2
      env:
        CARGO_NET_OFFLINE: 'false'
      with:
        # Do not hash unrelated preinstalled Rust versions or the whole runner image.
        shared-key: native-v3-${{ inputs.platform }}-${{ inputs.flavor }}-${{ steps.fingerprint.outputs.key }}
        # Keep the action's normalized manifests and dependency-change fallback.
        # Its metadata commands must remain online even when the build is offline.
        cmd-format: node "${{ steps.config.outputs.cache-command }}" {0}
        workspaces: src-tauri -> ${{ steps.config.outputs.target-dir }}
        cache-bin: false
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Check whether Cargo can build offline
      shell: bash
      env:
        RUST_TARGETS: ${{ inputs.targets }}
      run: |
        offline=true
        for target in $RUST_TARGETS; do
          if ! cargo fetch --manifest-path src-tauri/Cargo.toml --locked --offline --target "$target" > "$RUNNER_TEMP/baton-cargo-fetch.log" 2>&1; then
            offline=false
            break
          fi
        done
        echo "CARGO_NET_OFFLINE=$offline" >> "$GITHUB_ENV"
        if [[ "$offline" == true ]]; then
          echo "Locked Cargo dependencies are cached; registry networking disabled for this build."
        else
          echo "Cargo cache is incomplete; networking remains enabled."
        fi
